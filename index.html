<!doctype html>
<html lang="pt-BR" class="notranslate" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#c2410c" />
    <meta name="vercel-toolbar-disabled" content="true" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SENSAÇÃO GOUMERT" />
    <!-- Icon URLs are pinned to a fixed GitHub commit so they can't be
         corrupted again by AI Studio's binary-write bug — see vite.config.ts -->
    <link rel="icon" type="image/png" sizes="192x192" href="https://raw.githubusercontent.com/MichelCriadorFelix/RESTAURANTE-/1975716dd80f7c608f07a4d6ebb4628f6da7d780/public/icon-192.png" />
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/MichelCriadorFelix/RESTAURANTE-/1975716dd80f7c608f07a4d6ebb4628f6da7d780/public/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>SENSAÇÃO GOUMERT (Teste PIX)</title>
    <script>
      // Disable Vercel Toolbar and Speed Insights
      window.VERCEL_TOOLBAR_DISABLED = true;
      window.__VERCEL_TOOLBAR_DISABLED__ = true;
      window.VERCEL_SPEED_INSIGHTS_DISABLED = true;
      window.__VERCEL_SPEED_INSIGHTS_DISABLED__ = true;

      // Capture PWA Install Prompt EARLIEST possible
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        console.log('PWA: beforeinstallprompt event fired and captured');
        // Prevent the mini-infobar from appearing on mobile
        e.preventDefault();
        // Stash the event so it can be triggered later.
        window.deferredPrompt = e;
        // Dispatch a custom event for React components that are already loaded
        window.dispatchEvent(new CustomEvent('pwa-prompt-available', { detail: e }));
      });

      window.addEventListener('appinstalled', (evt) => {
        console.log('PWA: Application installed');
        window.deferredPrompt = null;
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
